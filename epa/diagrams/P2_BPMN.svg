<rect x="1470.0" y="1200" width="690.0" height="190" rx="0" fill="#f0f7f0" stroke="#253b50" stroke-width="2"/>
<text x="1482.0" y="1226.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">C6 Refusal preserves the licence</text>
<text x="1482.0" y="1248.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">C4(v,l) ∧ decided(v,refuse) ∧ reasonRecorded(v) ∧ state(v,refused)</text>
<text x="1482.0" y="1270.64" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">∧ unchanged(l,v)</text>
<text x="1482.0" y="1292.96" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">L = U · V5[refuse] · V7</text>
