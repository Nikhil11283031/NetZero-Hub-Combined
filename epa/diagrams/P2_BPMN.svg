<text x="772.0" y="1270.64" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">state(v,approved) ∧ varied(l,v) ∧ version(l,k+1)</text>
<text x="772.0" y="1292.96" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132f44" text-anchor="start">L = U · V5[approve] · V6</text>
