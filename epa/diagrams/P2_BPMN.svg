<text x="180" y="360.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">received(v) ∧ refersTo(v,l)</text>
<text x="180" y="430.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">A variation request referencing</text>
<text x="180" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">an existing licence is recorded.</text>
<text x="450" y="360.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">eligibilityChecked(v) ∧</text>
<text x="450" y="382.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">eligibleResult(v,q)</text>
<text x="450" y="430.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">Eligibility and licence version</text>
<text x="450" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">are checked; q is the result.</text>
<text x="450" y="650.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">state(v,invalid) ∧</text>
<text x="450" y="672.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">unchanged(l,v)</text>
<text x="450" y="720.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">The request is marked invalid;</text>
<text x="450" y="738.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">licence conditions stay</text>
<text x="450" y="757.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">unchanged.</text>
<text x="850" y="360.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">changeAssessed(v) ∧</text>
<text x="850" y="382.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">changeResult(v,e)</text>
<text x="850" y="430.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">The proposed change is assessed</text>
<text x="850" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">with result e.</text>
<text x="1120" y="360.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">decided(v,d) ∧</text>
<text x="1120" y="382.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">reasonRecorded(v)</text>
<text x="1120" y="430.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">An authorised officer records a</text>
<text x="1120" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">reasoned variation decision d.</text>
<text x="1530" y="980.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">state(v,approved) ∧</text>
<text x="1530" y="1002.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">varied(l,v) ∧</text>
<text x="1530" y="1024.64" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">version(l,k+1)</text>
<text x="1530" y="1050.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">The approved conditions replace</text>
<text x="1530" y="1068.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">the previous version.</text>
<text x="1530" y="650.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">state(v,refused) ∧</text>
<text x="1530" y="672.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">unchanged(l,v)</text>
<text x="1530" y="720.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">The variation is refused and the</text>
<text x="1530" y="738.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">licence is unchanged.</text>
<text x="1900" y="980.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#315c42" text-anchor="start">outcomeAvailable(v)</text>
<text x="1900" y="1050.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">The variation outcome is</text>
<text x="1900" y="1068.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#486252" text-anchor="start">available to its owner.</text>
