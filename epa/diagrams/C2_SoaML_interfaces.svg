<text x="63" y="359.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ getLicence(licenceId) : LicenceRecord</text>
<text x="63" y="399.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Provided interface: ILicensingRequests</text>
<text x="63" y="439.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Required interface: none for request and reply</text>
<rect x="825" y="100" width="710" height="405" rx="0" fill="white" stroke="#253b50" stroke-width="2"/>
<text x="1180.0" y="138.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#132f44" text-anchor="middle">«ServiceInterface» PollutionManagement</text>
<polyline points="825,162 1535,162" fill="none" stroke="#253b50" stroke-width="2.5"/>
<text x="843" y="199.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ submitReport(IncidentReport) : CaseReceipt</text>
<text x="843" y="239.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ getCase(caseId) : CaseStatus</text>
<text x="843" y="279.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ triage(caseId, version, RiskDecision) : CaseStatus</text>
<text x="843" y="319.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ recordEvidence(caseId, version, Evidence) : CaseStatus</text>
