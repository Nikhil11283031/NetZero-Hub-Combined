<text x="843" y="439.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Required interface: ILicenceContext</text>
<rect x="45" y="590" width="710" height="350" rx="0" fill="white" stroke="#253b50" stroke-width="2"/>
<text x="400.0" y="628.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#132f44" text-anchor="middle">«ServiceInterface» LicenceContext</text>
<polyline points="45,652 755,652" fill="none" stroke="#253b50" stroke-width="2.5"/>
<text x="63" y="689.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ getContext(licenceId) : LicenceContextRecord</text>
<text x="63" y="729.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Provider: LicenceService participant</text>
<text x="63" y="769.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Consumer: IncidentService participant</text>
<text x="63" y="809.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Record: id, active, version, conditions</text>
<text x="63" y="849.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">No applicant or reporter personal details</text>
<rect x="825" y="590" width="710" height="350" rx="0" fill="white" stroke="#253b50" stroke-width="2"/>
<text x="1180.0" y="628.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#132f44" text-anchor="middle">«MessageType» Shared data contracts</text>
<polyline points="825,652 1535,652" fill="none" stroke="#253b50" stroke-width="2.5"/>
<text x="843" y="689.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">CaseReceipt: caseId, processId, state, version</text>
<text x="843" y="729.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Command: expectedVersion, action, values</text>
<text x="843" y="769.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">Decision: approved or substantiated, rationale</text>
<text x="843" y="809.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">CaseStatus: owner-authorised case fields</text>
<text x="843" y="849.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">All IDs opaque strings; timestamps ISO 8601 with zone</text>
<text x="40" y="1008.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#132f44" text-anchor="start">Read-only polling returns outcomes. A callback interface is not assumed or implemented.</text>
</svg>