<text x="400.0" y="138.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#132f44" text-anchor="middle">«ServiceInterface» LicenceManagement</text>
<polyline points="45,162 755,162" fill="none" stroke="#253b50" stroke-width="2.5"/>
<text x="63" y="199.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ submitApplication(Application) : CaseReceipt</text>
<text x="63" y="239.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132f44" text-anchor="start">+ getCase(caseId) : CaseStatus</text>
