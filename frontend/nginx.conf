server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the backend through Docker's DNS so a recreated backend container
    # (new IP) doesn't leave nginx returning 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Specific EPA locations take priority over the general Django /api rule.
    # The public prefix is removed before FastAPI receives the request.
    location ^~ /api/v1/epa/licensing/ {
        set $licensing_upstream http://epa-licensing:8001;
        rewrite ^/api/v1/epa/licensing/(.*)$ /$1 break;
        proxy_pass $licensing_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location ^~ /api/v1/epa/incidents/ {
        set $incidents_upstream http://epa-incidents:8002;
        rewrite ^/api/v1/epa/incidents/(.*)$ /$1 break;
        proxy_pass $incidents_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Django: REST API, OpenAPI docs, admin and their static assets.
    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React router: serve index.html for client-side routes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
